<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="420" viewBox="0 0 1220 420" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif">
  <rect width="1220" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Node1: Sensor -->
  <rect x="30" y="175" width="190" height="72" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="125" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#155e75">wait_for_upstream</text>
  <text x="125" y="219" text-anchor="middle" font-size="11" fill="#0e7490">ExternalTaskSensor</text>
  <text x="125" y="236" text-anchor="middle" font-size="10" fill="#0e7490">mode=reschedule</text>

  <line x1="220" y1="211" x2="258" y2="211" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Node2: Branch -->
  <rect x="260" y="175" width="200" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="360" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#9a3412">branch_by_row_count</text>
  <text x="360" y="219" text-anchor="middle" font-size="11" fill="#c2410c">BranchPythonOperator</text>
  <text x="360" y="236" text-anchor="middle" font-size="10" fill="#c2410c">row_count &gt; 0 ?</text>

  <!-- branch up to Hive -->
  <line x1="460" y1="195" x2="500" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="470" y="150" font-size="10" fill="#475569">Yes</text>

  <!-- branch down to skip (dashed) -->
  <line x1="460" y1="227" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <text x="468" y="280" font-size="10" fill="#64748b">No</text>

  <!-- Node3a: Hive -->
  <rect x="500" y="60" width="200" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="600" y="85" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#1e3a8a">load_partition</text>
  <text x="600" y="104" text-anchor="middle" font-size="11" fill="#1d4ed8">HiveOperator</text>
  <text x="600" y="121" text-anchor="middle" font-size="10" fill="#1d4ed8">대용량 배치 적재</text>

  <line x1="700" y1="96" x2="738" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Node4: Presto -->
  <rect x="740" y="60" width="200" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="840" y="85" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#065f46">validate_row_count</text>
  <text x="840" y="104" text-anchor="middle" font-size="11" fill="#047857">PrestoOperator</text>
  <text x="840" y="121" text-anchor="middle" font-size="10" fill="#047857">빠른 검증 쿼리</text>

  <!-- Node3b: skip (dashed gray) -->
  <rect x="500" y="300" width="200" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="325" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#475569">skip_notification</text>
  <text x="600" y="344" text-anchor="middle" font-size="11" fill="#64748b">PythonOperator</text>
  <text x="600" y="361" text-anchor="middle" font-size="10" fill="#94a3b8">(skipped)</text>

  <!-- converge lines to Node5 -->
  <line x1="940" y1="96" x2="1000" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="700" y1="336" x2="1000" y2="226" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>

  <!-- Node5: final -->
  <rect x="1000" y="175" width="190" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1095" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#5b21b6">notify_result</text>
  <text x="1095" y="219" text-anchor="middle" font-size="10" fill="#6d28d9">trigger_rule=</text>
  <text x="1095" y="234" text-anchor="middle" font-size="10" fill="#6d28d9">none_failed_min_one_success</text>

  <text x="610" y="410" text-anchor="middle" font-size="14" fill="#1e293b">Sensor → Branch → (Hive / skip) → Presto → 합류(trigger_rule)</text>
</svg>
