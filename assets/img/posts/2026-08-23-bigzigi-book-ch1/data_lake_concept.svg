<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">형식이 제각각인 데이터가 일단 그대로 모인다</text>

  <!-- 5 data type icons -->
  <!-- CSV/table -->
  <g>
    <rect x="70" y="60" width="90" height="66" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <line x1="70" y1="82" x2="160" y2="82" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="70" y1="104" x2="160" y2="104" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="100" y1="60" x2="100" y2="126" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="130" y1="60" x2="130" y2="126" stroke="#2563eb" stroke-width="1.5"/>
    <text x="115" y="150" text-anchor="middle" font-size="13" fill="#1e3a8a">CSV</text>
  </g>

  <!-- JSON -->
  <g>
    <rect x="230" y="60" width="90" height="66" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="275" y="105" text-anchor="middle" font-size="30" font-weight="700" fill="#059669">{ }</text>
    <text x="275" y="150" text-anchor="middle" font-size="13" fill="#065f46">JSON</text>
  </g>

  <!-- image -->
  <g>
    <rect x="390" y="60" width="90" height="66" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <circle cx="415" cy="82" r="7" fill="#ea580c"/>
    <path d="M 400 116 L 425 90 L 445 108 L 460 96 L 470 116 Z" fill="#ea580c" opacity="0.8"/>
    <text x="435" y="150" text-anchor="middle" font-size="13" fill="#9a3412">IMAGE</text>
  </g>

  <!-- log -->
  <g>
    <rect x="550" y="60" width="90" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="562" y="80" font-size="11" font-family="monospace" fill="#b91c1c">[ERROR] fail</text>
    <text x="562" y="96" font-size="11" font-family="monospace" fill="#b91c1c">[INFO] retry</text>
    <text x="562" y="112" font-size="11" font-family="monospace" fill="#b91c1c">[WARN] slow</text>
    <text x="595" y="150" text-anchor="middle" font-size="13" fill="#991b1b">LOG</text>
  </g>

  <!-- binary -->
  <g>
    <rect x="710" y="60" width="90" height="66" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="755" y="90" text-anchor="middle" font-size="13" font-family="monospace" fill="#6d28d9">1011010</text>
    <text x="755" y="110" text-anchor="middle" font-size="13" font-family="monospace" fill="#6d28d9">0110101</text>
    <text x="755" y="150" text-anchor="middle" font-size="13" fill="#5b21b6">BINARY</text>
  </g>

  <!-- arrows down into lake -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 115 165 C 115 190, 300 210, 400 225"/>
    <path d="M 275 165 C 275 190, 350 210, 420 225"/>
    <path d="M 435 165 L 460 225"/>
    <path d="M 595 165 C 595 190, 520 210, 500 225"/>
    <path d="M 755 165 C 755 190, 600 210, 540 225"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- lake -->
  <path d="M 150 240 C 250 220, 750 220, 850 240 C 900 260, 900 340, 850 360 C 750 385, 250 385, 150 360 C 100 340, 100 260, 150 240 Z"
        fill="#bfdbfe" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="500" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">데이터 레이크</text>
  <text x="500" y="315" text-anchor="middle" font-size="13" fill="#1e40af">형식을 가리지 않고 일단 그대로 저장</text>

  <!-- arrow from lake to table, "later" -->
  <path d="M 620 320 C 700 340, 750 370, 780 400" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="700" y="375" font-size="13" fill="#475569">나중에 스키마를 입혀서</text>

  <!-- resulting table -->
  <g>
    <rect x="770" y="405" width="150" height="90" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <line x1="770" y1="430" x2="920" y2="430" stroke="#334155" stroke-width="1.2"/>
    <line x1="770" y1="455" x2="920" y2="455" stroke="#334155" stroke-width="1.2"/>
    <line x1="770" y1="475" x2="920" y2="475" stroke="#334155" stroke-width="1.2"/>
    <line x1="845" y1="405" x2="845" y2="495" stroke="#334155" stroke-width="1.2"/>
    <text x="845" y="512" text-anchor="middle" font-size="13" fill="#334155">테이블 (DW)</text>
  </g>

  <text x="220" y="450" font-size="13.5" fill="#475569">"먼저 데이터가 있고,</text>
  <text x="220" y="472" font-size="13.5" fill="#475569">나중에 테이블을 설계"</text>
</svg>
