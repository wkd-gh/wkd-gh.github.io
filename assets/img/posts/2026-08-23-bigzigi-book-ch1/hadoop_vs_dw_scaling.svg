<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="250" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Hadoop — Scale-Out</text>
  <text x="750" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">데이터 웨어하우스 — 통합 장비</text>

  <!-- LEFT: many small nodes -->
  <g>
    <rect x="60"  y="80" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="140" y="80" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="220" y="80" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="300" y="80" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="380" y="80" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="410" y="115" text-anchor="middle" font-size="22" fill="#2563eb">+</text>
  </g>
  <text x="250" y="170" text-anchor="middle" font-size="13" fill="#1e3a8a">노드를 옆으로 추가하며 확장</text>

  <rect x="60" y="200" width="380" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="250" y="230" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">데이터가 늘면 노드만 더 붙이면 된다</text>

  <!-- RIGHT: one big integrated box -->
  <g>
    <rect x="620" y="80" width="280" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="760" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">하드웨어 + 소프트웨어</text>
    <text x="760" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">통합 장비 (단일 유닛)</text>
    <text x="760" y="180" text-anchor="middle" font-size="22" fill="#c2410c">🔒</text>
  </g>
  <text x="760" y="220" text-anchor="middle" font-size="13" fill="#9a3412">용량을 늘리려면 장비를 통째로 교체</text>

  <rect x="620" y="240" width="280" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="760" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">대신 안정적인 성능은 보장된다</text>

  <text x="500" y="360" text-anchor="middle" font-size="13.5" fill="#475569">그래서 가속도적으로 늘어나는 데이터는 Hadoop,</text>
  <text x="500" y="384" text-anchor="middle" font-size="13.5" fill="#475569">비교적 작고 중요한 데이터는 DW로 나눠 쓰는 게 당시엔 자연스러운 선택이었다</text>
</svg>
