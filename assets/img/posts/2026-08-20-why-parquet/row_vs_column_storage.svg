<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="15" fill="#475569">예시 테이블: id / name / age, 3개 컬럼 × 3개 row</text>

  <!-- LEFT: Row-oriented -->
  <text x="250" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Row-oriented (CSV / JSON)</text>

  <!-- row 1 -->
  <g font-family="monospace" font-size="14">
    <rect x="40" y="75" width="126" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="103" y="105" text-anchor="middle" fill="#1e3a8a">id: 1</text>
    <rect x="166" y="75" width="126" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="229" y="105" text-anchor="middle" fill="#065f46">name: Alice</text>
    <rect x="292" y="75" width="126" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="355" y="105" text-anchor="middle" fill="#9a3412">age: 25</text>
  </g>
  <text x="20" y="105" font-size="12" fill="#94a3b8">row1</text>

  <!-- row 2 -->
  <g font-family="monospace" font-size="14">
    <rect x="40" y="135" width="126" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="103" y="165" text-anchor="middle" fill="#1e3a8a">id: 2</text>
    <rect x="166" y="135" width="126" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="229" y="165" text-anchor="middle" fill="#065f46">name: Bob</text>
    <rect x="292" y="135" width="126" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="355" y="165" text-anchor="middle" fill="#9a3412">age: 30</text>
  </g>
  <text x="20" y="165" font-size="12" fill="#94a3b8">row2</text>

  <!-- row 3 -->
  <g font-family="monospace" font-size="14">
    <rect x="40" y="195" width="126" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="103" y="225" text-anchor="middle" fill="#1e3a8a">id: 3</text>
    <rect x="166" y="195" width="126" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="229" y="225" text-anchor="middle" fill="#065f46">name: Carol</text>
    <rect x="292" y="195" width="126" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="355" y="225" text-anchor="middle" fill="#9a3412">age: 28</text>
  </g>
  <text x="20" y="225" font-size="12" fill="#94a3b8">row3</text>

  <line x1="230" y1="255" x2="230" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="300" text-anchor="middle" font-size="13" fill="#475569">디스크 저장 순서</text>

  <!-- linear sequence: id,name,age repeated x3 -->
  <g>
    <rect x="40"  y="315" width="30" height="30" fill="#2563eb"/>
    <rect x="76"  y="315" width="30" height="30" fill="#059669"/>
    <rect x="112" y="315" width="30" height="30" fill="#ea580c"/>
    <rect x="148" y="315" width="30" height="30" fill="#2563eb"/>
    <rect x="184" y="315" width="30" height="30" fill="#059669"/>
    <rect x="220" y="315" width="30" height="30" fill="#ea580c"/>
    <rect x="256" y="315" width="30" height="30" fill="#2563eb"/>
    <rect x="292" y="315" width="30" height="30" fill="#059669"/>
    <rect x="328" y="315" width="30" height="30" fill="#ea580c"/>
  </g>

  <text x="230" y="375" text-anchor="middle" font-size="13" fill="#b91c1c">타입이 계속 바뀌어서</text>
  <text x="230" y="395" text-anchor="middle" font-size="13" fill="#b91c1c">압축 효율이 낮음</text>

  <!-- divider -->
  <line x1="480" y1="60" x2="480" y2="410" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT: Column-oriented -->
  <text x="750" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Column-oriented (Parquet)</text>

  <g font-family="monospace" font-size="14">
    <rect x="540" y="75" width="126" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="603" y="105" text-anchor="middle" fill="#1e3a8a">1</text>
    <rect x="666" y="75" width="126" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="729" y="105" text-anchor="middle" fill="#1e3a8a">2</text>
    <rect x="792" y="75" width="126" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="855" y="105" text-anchor="middle" fill="#1e3a8a">3</text>
  </g>
  <text x="520" y="105" font-size="12" fill="#94a3b8">id</text>

  <g font-family="monospace" font-size="14">
    <rect x="540" y="135" width="126" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="603" y="165" text-anchor="middle" fill="#065f46">Alice</text>
    <rect x="666" y="135" width="126" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="729" y="165" text-anchor="middle" fill="#065f46">Bob</text>
    <rect x="792" y="135" width="126" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="855" y="165" text-anchor="middle" fill="#065f46">Carol</text>
  </g>
  <text x="510" y="165" font-size="12" fill="#94a3b8">name</text>

  <g font-family="monospace" font-size="14">
    <rect x="540" y="195" width="126" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="603" y="225" text-anchor="middle" fill="#9a3412">25</text>
    <rect x="666" y="195" width="126" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="729" y="225" text-anchor="middle" fill="#9a3412">30</text>
    <rect x="792" y="195" width="126" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="855" y="225" text-anchor="middle" fill="#9a3412">28</text>
  </g>
  <text x="514" y="225" font-size="12" fill="#94a3b8">age</text>

  <line x1="730" y1="255" x2="730" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <text x="730" y="300" text-anchor="middle" font-size="13" fill="#475569">디스크 저장 순서</text>

  <!-- linear sequence: id,id,id,name,name,name,age,age,age -->
  <g>
    <rect x="540" y="315" width="30" height="30" fill="#2563eb"/>
    <rect x="576" y="315" width="30" height="30" fill="#2563eb"/>
    <rect x="612" y="315" width="30" height="30" fill="#2563eb"/>
    <rect x="648" y="315" width="30" height="30" fill="#059669"/>
    <rect x="684" y="315" width="30" height="30" fill="#059669"/>
    <rect x="720" y="315" width="30" height="30" fill="#059669"/>
    <rect x="756" y="315" width="30" height="30" fill="#ea580c"/>
    <rect x="792" y="315" width="30" height="30" fill="#ea580c"/>
    <rect x="828" y="315" width="30" height="30" fill="#ea580c"/>
  </g>

  <text x="730" y="375" text-anchor="middle" font-size="13" fill="#047857">같은 타입끼리 모여있어서</text>
  <text x="730" y="395" text-anchor="middle" font-size="13" fill="#047857">압축·인코딩 효율이 높음</text>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <rect x="370" y="440" width="18" height="18" fill="#2563eb"/>
    <text x="394" y="454">id</text>
    <rect x="450" y="440" width="18" height="18" fill="#059669"/>
    <text x="474" y="454">name</text>
    <rect x="540" y="440" width="18" height="18" fill="#ea580c"/>
    <text x="564" y="454">age</text>
  </g>
</svg>
